<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Web Socket</title>
    <!-- Add Bootstrap CSS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <!-- Add StompJs for WebSocket in SpringBoot-->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.js"></script>
    <!-- Add script for JS file -->
    <script src="index.js"></script>
</head>
<body>
<!-- Add div container for other elements -->
<div class="container">

    <!-- Lista de usuarios conectados -->
    <div class="container">
        <h5>Usuarios conectados</h5>
        <ul id="ULUsuarios" class="list-group"></ul>
        <p>Enviar a: <strong id="lblDestinatario">Todos</strong></p>
    </div>

    <!-- Add div that contains messages -->
    <div id="mensajes" class="container">
        <ul id="ULMensajes" class="list-group"></ul>
    </div>
    <!-- Add another container for the elements to send messages -->
    <div class="container">
        <input id="txtNombre" type="text" class="form-control" placeholder="Nombre">
        <button id="btnRegistrar" class="btn btn-success">Registrar nombre</button>
        <input id="txtMensaje" type="text" class="form-control" placeholder="Mensaje">
        <button id="btnEnviar" class="btn btn-primary">Enviar</button>
        <button id="btnEnviarPrivado" class="btn btn-warning">Enviar privado</button>
    </div>

    <!-- Entidad Producto -->
    <div class="container mt-4">
        <h5>Enviar producto</h5>
        <input id="txtProdId" type="number" class="form-control" placeholder="ID">
        <input id="txtProdNombre" type="text" class="form-control" placeholder="Nombre del producto">
        <input id="txtProdPrecio" type="number" step="0.01" class="form-control" placeholder="Precio">
        <input id="txtProdStock" type="number" class="form-control" placeholder="Stock">
        <button id="btnEnviarEntidad" class="btn btn-primary">Enviar producto</button>

        <table class="table table-striped mt-3">
            <thead>
            <tr><th>De</th><th>Para</th><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr>
            </thead>
            <tbody id="tbodyEntidades"></tbody>
        </table>
    </div>

</div>
</body>
</html>
