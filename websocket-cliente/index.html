<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajero WebSockets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.js"></script>
    <script src="index.js"></script>
</head>
<body>

<header class="app-header">
    <div class="container d-flex align-items-center justify-content-between">
        <h1 class="app-title">Mensajero</h1>
        <span id="estadoConexion" class="status-pill status-pill--off">
            <span class="status-dot"></span><span id="txtEstado">Desconectado</span>
        </span>
    </div>
</header>

<main class="container app-main">
    <div class="row">

        <!-- Columna izquierda: registro + usuarios -->
        <aside class="col-lg-4 mb-4">
            <section class="panel">
                <h2 class="panel-title">Tu nombre</h2>
                <div class="input-group">
                    <input id="txtNombre" type="text" class="form-control" placeholder="Ej. Adolfo Ortega" maxlength="30">
                    <div class="input-group-append">
                        <button id="btnRegistrar" class="btn btn-success">Registrar</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h2 class="panel-title">Usuarios conectados</h2>
                <ul id="ULUsuarios" class="list-group users-list"></ul>
                <p class="dest-hint">Enviar a: <span class="dest-pill" id="lblDestinatario">Todos</span></p>
            </section>
        </aside>

        <!-- Columna derecha: chat + productos -->
        <section class="col-lg-8">
            <div class="panel panel--chat">
                <h2 class="panel-title">Chat</h2>
                <div id="mensajes" class="chat-box">
                    <ul id="ULMensajes" class="chat-list"></ul>
                </div>
                <div class="composer">
                    <input id="txtMensaje" type="text" class="form-control" placeholder="Escribe un mensaje...">
                    <button id="btnEnviar" class="btn btn-primary">Enviar</button>
                    <button id="btnEnviarPrivado" class="btn btn-warning">Privado</button>
                </div>
            </div>

            <div class="panel">
                <h2 class="panel-title">Enviar producto</h2>
                <form id="formProducto" novalidate>
                    <div class="form-row">
                        <div class="form-group col-md-3">
                            <label for="txtProdId">ID</label>
                            <input id="txtProdId" name="id" type="number" min="1" step="1" class="form-control" placeholder="101" required>
                            <div class="invalid-feedback">ID entero mayor a 0.</div>
                        </div>
                        <div class="form-group col-md-9">
                            <label for="txtProdNombre">Nombre</label>
                            <input id="txtProdNombre" name="nombre" type="text" maxlength="60" class="form-control" placeholder="Nombre del producto" required>
                            <div class="invalid-feedback">El nombre es obligatorio.</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="txtProdPrecio">Precio</label>
                            <div class="input-group">
                                <div class="input-group-prepend"><span class="input-group-text">$</span></div>
                                <input id="txtProdPrecio" name="precio" type="number" min="0" step="0.01" class="form-control" placeholder="0.00" required>
                                <div class="invalid-feedback">Precio válido (0 o más).</div>
                            </div>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="txtProdStock">Stock</label>
                            <input id="txtProdStock" name="stock" type="number" min="0" step="1" class="form-control" placeholder="Unidades" required>
                            <div class="invalid-feedback">Stock entero (0 o más).</div>
                        </div>
                    </div>
                    <p class="dest-hint">Se enviará a: <span class="dest-pill" id="lblDestinoProducto">Todos</span></p>
                    <button id="btnEnviarEntidad" type="submit" class="btn btn-primary">Enviar producto</button>
                    <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                </form>

                <div class="table-responsive mt-4">
                    <table class="table table-products">
                        <thead><tr><th>De</th><th>Para</th><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead>
                        <tbody id="tbodyEntidades"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</main>
</body>
</html>
